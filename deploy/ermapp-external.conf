# Vhost Apache KEDUA, khusus akses eksternal (lewat Cloudflare Tunnel) untuk
# fitur Cuti/Izin saja. Vhost ini TIDAK diakses langsung dari internet — cuma
# `cloudflared` di server yang ngobrol ke port ini lewat localhost, jadi tetap
# aman walau tidak pakai HTTPS sendiri (TLS-nya sudah di-terminate di edge
# Cloudflare + wajib lolos Cloudflare Access dulu sebelum sampai sini).
#
# Lokasi di server: /etc/apache2/sites-available/ermapp-external.conf
# Aktifkan:
#   sudo a2ensite ermapp-external
#   sudo systemctl reload apache2
#
# Vhost utama (deploy/ermapp.conf, port 80, full app) TIDAK diubah — tetap
# untuk jaringan internal RS saja.

Listen 127.0.0.1:8082

<VirtualHost 127.0.0.1:8082>
    ServerName _default_
    DocumentRoot /var/www/erm/frontend/dist

    AllowEncodedSlashes NoDecode

    # --- Deny-by-default utk semua /api/*, lewat fase otorisasi (bukan
    #     RewriteRule) supaya AMAN digabung dengan ProxyPass di bawah —
    #     <LocationMatch> yang lebih spesifik (per endpoint yg di-allow)
    #     otomatis menang atas yang generik ini krn urutan spesifisitas
    #     Apache, tanpa risiko rebutan urutan proses dgn mod_proxy.
    <LocationMatch "^/api/">
        Require all denied
    </LocationMatch>

    <Directory /var/www/erm/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On

    # --- Allow-list: HANYA endpoint yang dipakai fitur Cuti/Izin + prasyarat
    #     shell aplikasi (login, data diri utk header/greeting). Endpoint
    #     lain (Absen/kamera, Lembur, Rekap Kehadiran, admin, dst) SENGAJA
    #     tidak didaftarkan di sini supaya kena blokir <LocationMatch> di atas.
    #     Tiap ProxyPass dipasangkan <Location> dgn "Require all granted"
    #     supaya menang atas deny-by-default (lebih spesifik).
    <Location /api/auth/login>
        Require all granted
    </Location>
    ProxyPass /api/auth/login http://127.0.0.1:8080/api/auth/login
    ProxyPassReverse /api/auth/login http://127.0.0.1:8080/api/auth/login

    <Location /api/presensi/me>
        Require all granted
    </Location>
    ProxyPass /api/presensi/me http://127.0.0.1:8080/api/presensi/me
    ProxyPassReverse /api/presensi/me http://127.0.0.1:8080/api/presensi/me

    # Cuti/Izin: cuma 3 endpoint spesifik yg dipakai CutiIzinView di HP —
    # submit baru, lihat riwayat SENDIRI, batalkan pengajuan SENDIRI.
    # SENGAJA tidak pakai prefix match biasa (yg akan ikut membocorkan
    # /api/pengajuan-cuti/list — endpoint admin lihat SEMUA pengajuan semua
    # pegawai — dan /approve, /reject) — tiap rule di-anchor persis (^...$)
    # ke satu endpoint saja.
    <LocationMatch "^/api/pengajuan-cuti$">
        Require all granted
    </LocationMatch>
    ProxyPassMatch ^/api/pengajuan-cuti$ http://127.0.0.1:8080/api/pengajuan-cuti

    <LocationMatch "^/api/pengajuan-cuti/saya$">
        Require all granted
    </LocationMatch>
    ProxyPassMatch ^/api/pengajuan-cuti/saya$ http://127.0.0.1:8080/api/pengajuan-cuti/saya

    # DELETE by no_pengajuan (mis. "PC20260811001") — "list" dikecualikan
    # eksplisit (endpoint admin), dan krn regex berhenti persis 1 segmen
    # setelah "/pengajuan-cuti/", path admin ".../approve" & ".../reject"
    # (ada segmen tambahan) otomatis tidak cocok & tetap kena blokir default.
    <LocationMatch "^/api/pengajuan-cuti/(?!list$)[A-Za-z0-9]+$">
        Require all granted
    </LocationMatch>
    ProxyPassMatch ^/api/pengajuan-cuti/(?!list$)([A-Za-z0-9]+)$ http://127.0.0.1:8080/api/pengajuan-cuti/$1

    # Pencarian PJ pengganti (dropdown di form Cuti/Izin) — cuma nama+NIK,
    # bukan data pegawai lengkap.
    <Location /api/pegawai/list>
        Require all granted
    </Location>
    ProxyPass /api/pegawai/list http://127.0.0.1:8080/api/pegawai/list
    ProxyPassReverse /api/pegawai/list http://127.0.0.1:8080/api/pegawai/list

    ErrorLog ${APACHE_LOG_DIR}/ermapp_external_error.log
    CustomLog ${APACHE_LOG_DIR}/ermapp_external_access.log combined
</VirtualHost>
