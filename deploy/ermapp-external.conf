# Vhost Apache KEDUA, khusus akses eksternal (lewat Cloudflare Tunnel).
# Vhost ini TIDAK diakses langsung dari internet — cuma `cloudflared` di
# server yang ngobrol ke port ini lewat localhost, jadi tetap aman walau
# tidak pakai HTTPS sendiri (TLS-nya sudah di-terminate di edge Cloudflare).
#
# CAKUPAN: SELURUH ERMApp (RM pasien, billing, resep, lab, radiologi, dst)
# bisa diakses lewat vhost ini, KECUALI endpoint absen (checkin/checkout) —
# sengaja diblokir krn verifikasi kamera+GPS-nya cuma berarti kalau staf
# benar-benar di lokasi RS; diakses dari luar bikin verifikasi itu percuma
# (bisa "absen" padahal tidak di RS).
#
# !!! PERINGATAN KEAMANAN !!!
# Vhost ini membuka SELURUH data rekam medis & billing pasien ke internet
# lewat tunnel Cloudflare. Satu-satunya lapis proteksi request masuk adalah
# Cloudflare Access (autentikasi WAJIB di edge Cloudflare sebelum request
# sampai ke server ini) — dikonfigurasi terpisah di dashboard Cloudflare
# Zero Trust, BUKAN di file ini/repo ini. WAJIB pastikan policy Cloudflare
# Access sudah aktif & mewajibkan login (mis. email OTP/SSO kantor) untuk
# hostname presensi.rsislamibnusinasigli.com SEBELUM tunnel diaktifkan —
# tanpa itu, vhost ini setara membuka seluruh sistem RS ke publik.
#
# Lokasi di server: /etc/apache2/sites-available/ermapp-external.conf
# Aktifkan:
#   sudo a2ensite ermapp-external
#   sudo systemctl reload apache2
#
# Vhost utama (deploy/ermapp.conf, port 80, full app) TIDAK diubah — tetap
# untuk jaringan internal RS saja (tanpa perlu lolos Cloudflare Access).

Listen 127.0.0.1:8082

<VirtualHost 127.0.0.1:8082>
    ServerName _default_
    DocumentRoot /var/www/erm/frontend/dist

    AllowEncodedSlashes NoDecode

    # Blokir HANYA endpoint clock-in/clock-out — dicek lewat fase otorisasi
    # (bukan RewriteRule) supaya berlaku juga utk request yg diteruskan lewat
    # ProxyPass di bawah. Ini satu-satunya Require di vhost ini; endpoint lain
    # tidak py Require sama sekali (= tidak dibatasi Apache, ikut mengalir ke
    # ProxyPass generik). Tidak ada blok "allow" lain yg bisa "menang" dan
    # membuka lagi checkin/checkout krn cuma pattern ini yg match utk 2 path
    # tsb.
    <LocationMatch "^/api/presensi/(checkin|checkout)$">
        Require all denied
    </LocationMatch>

    <Directory /var/www/erm/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On

    # Sama persis dgn set ProxyPass di vhost internal (deploy/ermapp.conf) —
    # seluruh app diproxy, termasuk /api/presensi/checkin & /checkout, tapi
    # keduanya sudah kena Require all denied di atas (fase otorisasi jalan
    # SEBELUM mod_proxy meneruskan request, jadi ProxyPass generik ini tidak
    # "membuka lagi" apa yg sudah didenied).
    ProxyPass /api http://127.0.0.1:8080/api nocanon
    ProxyPassReverse /api http://127.0.0.1:8080/api

    ProxyPass /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd
    ProxyPassReverse /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd

    ProxyPass /radiologi http://127.0.0.1:8080/radiologi
    ProxyPassReverse /radiologi http://127.0.0.1:8080/radiologi

    ProxyPass /berkasrawat http://127.0.0.1:8080/berkasrawat
    ProxyPassReverse /berkasrawat http://127.0.0.1:8080/berkasrawat

    ProxyPass /labpa http://127.0.0.1:8080/labpa
    ProxyPassReverse /labpa http://127.0.0.1:8080/labpa

    ProxyPass /images http://127.0.0.1:8080/images
    ProxyPassReverse /images http://127.0.0.1:8080/images

    ProxyPass /uploads http://127.0.0.1:8080/uploads
    ProxyPassReverse /uploads http://127.0.0.1:8080/uploads

    ErrorLog ${APACHE_LOG_DIR}/ermapp_external_error.log
    CustomLog ${APACHE_LOG_DIR}/ermapp_external_access.log combined
</VirtualHost>
