# Vhost Apache KEDUA, khusus akses eksternal (lewat Cloudflare Tunnel).
# Vhost ini TIDAK diakses langsung dari internet — cuma `cloudflared` di
# server yang ngobrol ke port ini lewat localhost, jadi tetap aman walau
# tidak pakai HTTPS sendiri (TLS-nya sudah di-terminate di edge Cloudflare).
#
# CAKUPAN: KHUSUS PresensiMobile.tsx (bundle dist-presensi) — BUKAN lagi
# seluruh ERMApp. Frontend RM pasien/billing/lab/radiologi (dist, app
# desktop penuh) TIDAK diproxy/disajikan lewat vhost ini sama sekali;
# proxy file klinis (/asuhan-medis-igd, /radiologi, /berkasrawat, /labpa,
# /images) juga sudah DIHAPUS dari vhost ini krn PresensiMobile.tsx tidak
# pernah memakainya — mengurangi permukaan yg kebuka ke internet.
# Endpoint absen (checkin/checkout) tetap diblokir krn verifikasi
# kamera+GPS-nya cuma berarti kalau staf benar-benar di lokasi RS; diakses
# dari luar bikin verifikasi itu percuma (bisa "absen" padahal tidak di RS).
#
# !!! PERINGATAN KEAMANAN (masih berlaku sebagian) !!!
# /api masih diproxy APA ADANYA ke backend Go yg sama (satu-satunya
# backend, dipakai bareng app desktop) — endpoint di luar lingkup
# PresensiMobile.tsx (mis. data RM pasien) SECARA TEKNIS tetap bisa
# dipanggil langsung lewat /api walau frontend-nya sudah tidak ada di
# sini, KARENA Apache cuma mengatur file statis yg disajikan, bukan
# endpoint /api mana yg boleh dipanggil. Mempersempit /api sendiri
# (whitelist per-endpoint) BELUM dikerjakan di sini — perlu audit endpoint
# PresensiMobile.tsx dulu (termasuk Poli/IGD/Ranap/Operasi utk role
# dokter, yg ikut menampilkan data pasien) sebelum dipersempit lebih jauh,
# supaya tidak salah blokir fitur yg sah dipakai. Satu-satunya lapis
# proteksi request masuk sampai saat ini adalah Cloudflare Access
# (autentikasi WAJIB di edge Cloudflare) — dikonfigurasi terpisah di
# dashboard Cloudflare Zero Trust, BUKAN di file ini/repo ini. WAJIB
# pastikan policy Cloudflare Access sudah aktif & mewajibkan login (mis.
# email OTP/SSO kantor) untuk hostname presensi.rsislamibnusinasigli.com
# SEBELUM tunnel diaktifkan.
#
# Lokasi di server: /etc/apache2/sites-available/ermapp-external.conf
# Aktifkan:
#   sudo a2ensite ermapp-external
#   sudo systemctl reload apache2
#
# Vhost utama (deploy/ermapp.conf, port 80, full app) TIDAK diubah — tetap
# untuk jaringan internal RS saja (tanpa perlu lolos Cloudflare Access).

Listen 127.0.0.1:8082

<VirtualHost 127.0.0.1:8082>
    ServerName _default_
    DocumentRoot /var/www/erm/frontend/dist-presensi

    AllowEncodedSlashes NoDecode

    # Blokir HANYA endpoint clock-in/clock-out — dicek lewat fase otorisasi
    # (bukan RewriteRule) supaya berlaku juga utk request yg diteruskan lewat
    # ProxyPass di bawah. Ini satu-satunya Require di vhost ini; endpoint lain
    # tidak py Require sama sekali (= tidak dibatasi Apache, ikut mengalir ke
    # ProxyPass generik). Tidak ada blok "allow" lain yg bisa "menang" dan
    # membuka lagi checkin/checkout krn cuma pattern ini yg match utk 2 path
    # tsb.
    <LocationMatch "^/api/presensi/(checkin|checkout)$">
        Require all denied
    </LocationMatch>

    <Directory /var/www/erm/frontend/dist-presensi>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On

    # /api & /uploads — dipakai langsung oleh PresensiMobile.tsx (login,
    # absen, jadwal, cuti/izin, lapor IT, foto profil/presensi, dst).
    # /api/presensi/checkin & /checkout tetap kena Require all denied di
    # atas (fase otorisasi jalan SEBELUM mod_proxy meneruskan request, jadi
    # ProxyPass generik ini tidak "membuka lagi" apa yg sudah didenied).
    ProxyPass /api http://127.0.0.1:8080/api nocanon
    ProxyPassReverse /api http://127.0.0.1:8080/api

    ProxyPass /uploads http://127.0.0.1:8080/uploads
    ProxyPassReverse /uploads http://127.0.0.1:8080/uploads

    ErrorLog ${APACHE_LOG_DIR}/ermapp_external_error.log
    CustomLog ${APACHE_LOG_DIR}/ermapp_external_access.log combined
</VirtualHost>
