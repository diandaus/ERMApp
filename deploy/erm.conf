# Vhost Apache HTTPS internal utk erm.rsislamibnusinasigli.com — aplikasi
# web PENUH (RM pasien/billing/casemix/radiologi/dst, App.tsx), TERPISAH
# dari presensi.rsislamibnusinasigli.com (deploy/ermapp.conf vhost *:443)
# yang sekarang KHUSUS PresensiMobile.tsx (dist-presensi, bundle kecil).
# DocumentRoot vhost ini KHUSUS dist (app penuh) — BUKAN dist-presensi.
#
# ServerName-nya SENGAJA disamakan dgn hostname eksternal
# (erm.rsislamibnusinasigli.com, lihat deploy/erm-external.conf +
# deploy/cloudflared/config.yml) supaya staf bisa pakai SATU domain yang
# sama dari dalam maupun luar RS — dibedakan lewat DNS split-horizon: DNS
# lokal RS (mis. static DNS di Mikrotik) diarahkan ke IP internal server
# ini, sementara DNS publik (Cloudflare) tetap ke tunnel utk akses dari
# luar. Lihat deploy/README-dns-lokal.md utk cara verifikasi DNS
# lokalnya (pola persis sama, tinggal ganti hostname).
#
# HTTPS (bukan cuma HTTP polos spt vhost *:80 di ermapp.conf) diperlukan
# krn beberapa fitur browser modern (mis. navigator.clipboard di tombol
# copy username RegisterView) cuma jalan di secure context.
#
# Lokasi di server: /etc/apache2/sites-available/erm.conf
# Aktifkan:
#   sudo a2ensite erm && sudo systemctl reload apache2
#
# Cara minta sertifikat (DNS-01 via Cloudflare, sama pola dgn presensi —
# lihat instruksi lengkap di komentar deploy/ermapp.conf):
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d erm.rsislamibnusinasigli.com
<VirtualHost *:443>
    ServerName erm.rsislamibnusinasigli.com
    DocumentRoot /var/www/erm/frontend/dist

    AllowEncodedSlashes NoDecode

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/erm.rsislamibnusinasigli.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/erm.rsislamibnusinasigli.com/privkey.pem

    <Directory /var/www/erm/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8080/api nocanon
    ProxyPassReverse /api http://127.0.0.1:8080/api

    ProxyPass /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd
    ProxyPassReverse /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd

    ProxyPass /radiologi http://127.0.0.1:8080/radiologi
    ProxyPassReverse /radiologi http://127.0.0.1:8080/radiologi

    ProxyPass /berkasrawat http://127.0.0.1:8080/berkasrawat
    ProxyPassReverse /berkasrawat http://127.0.0.1:8080/berkasrawat

    ProxyPass /labpa http://127.0.0.1:8080/labpa
    ProxyPassReverse /labpa http://127.0.0.1:8080/labpa

    ProxyPass /images http://127.0.0.1:8080/images
    ProxyPassReverse /images http://127.0.0.1:8080/images

    ProxyPass /uploads http://127.0.0.1:8080/uploads
    ProxyPassReverse /uploads http://127.0.0.1:8080/uploads

    ErrorLog ${APACHE_LOG_DIR}/erm_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/erm_ssl_access.log combined
</VirtualHost>
