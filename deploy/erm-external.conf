# Vhost Apache KEDUA, khusus akses eksternal erm.rsislamibnusinasigli.com
# (lewat Cloudflare Tunnel) — aplikasi web PENUH (App.tsx), padanan
# eksternal dari deploy/erm.conf. Vhost ini TIDAK diakses langsung dari
# internet — cuma `cloudflared` di server yang ngobrol ke port ini lewat
# localhost, jadi tetap aman walau tidak pakai HTTPS sendiri (TLS-nya
# sudah di-terminate di edge Cloudflare).
#
# CAKUPAN: SELURUH ERMApp (RM pasien, billing, resep, lab, radiologi, dst)
# bisa diakses lewat vhost ini, KECUALI endpoint absen (checkin/checkout)
# — App.tsx mengarahkan login dari layar sempit/akun mandiri ke
# PresensiMobileView juga (bukan cuma domain presensi), jadi blokir ini
# WAJIB tetap ada di sini juga spy fitur absen tidak bisa dipakai dari
# luar RS lewat domain ini (verifikasi kamera+GPS-nya cuma berarti kalau
# staf benar-benar di lokasi RS).
#
# !!! PERINGATAN KEAMANAN !!!
# Vhost ini membuka SELURUH data rekam medis & billing pasien ke internet
# lewat tunnel Cloudflare. Satu-satunya lapis proteksi request masuk adalah
# Cloudflare Access (autentikasi WAJIB di edge Cloudflare sebelum request
# sampai ke server ini) — dikonfigurasi terpisah di dashboard Cloudflare
# Zero Trust, BUKAN di file ini/repo ini. WAJIB pastikan policy Cloudflare
# Access sudah aktif & mewajibkan login (mis. email OTP/SSO kantor) untuk
# hostname erm.rsislamibnusinasigli.com SEBELUM ingress rule-nya
# diaktifkan di deploy/cloudflared/config.yml — tanpa itu, vhost ini
# setara membuka seluruh sistem RS ke publik.
#
# Lokasi di server: /etc/apache2/sites-available/erm-external.conf
# Aktifkan:
#   sudo a2ensite erm-external
#   sudo systemctl reload apache2
#
# Vhost internal (deploy/erm.conf, *:443, app penuh) TIDAK diubah — tetap
# untuk jaringan internal RS saja (tanpa perlu lolos Cloudflare Access).

Listen 127.0.0.1:8083

<VirtualHost 127.0.0.1:8083>
    ServerName _default_
    DocumentRoot /var/www/erm/frontend/dist

    AllowEncodedSlashes NoDecode

    # Blokir HANYA endpoint clock-in/clock-out — lihat penjelasan lengkap
    # di deploy/ermapp-external.conf (pola identik).
    <LocationMatch "^/api/presensi/(checkin|checkout)$">
        Require all denied
    </LocationMatch>

    <Directory /var/www/erm/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8080/api nocanon
    ProxyPassReverse /api http://127.0.0.1:8080/api

    ProxyPass /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd
    ProxyPassReverse /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd

    ProxyPass /radiologi http://127.0.0.1:8080/radiologi
    ProxyPassReverse /radiologi http://127.0.0.1:8080/radiologi

    ProxyPass /berkasrawat http://127.0.0.1:8080/berkasrawat
    ProxyPassReverse /berkasrawat http://127.0.0.1:8080/berkasrawat

    ProxyPass /labpa http://127.0.0.1:8080/labpa
    ProxyPassReverse /labpa http://127.0.0.1:8080/labpa

    ProxyPass /images http://127.0.0.1:8080/images
    ProxyPassReverse /images http://127.0.0.1:8080/images

    ProxyPass /uploads http://127.0.0.1:8080/uploads
    ProxyPassReverse /uploads http://127.0.0.1:8080/uploads

    ErrorLog ${APACHE_LOG_DIR}/erm_external_error.log
    CustomLog ${APACHE_LOG_DIR}/erm_external_access.log combined
</VirtualHost>
