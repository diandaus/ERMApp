# Konfigurasi Apache vhost untuk ERMApp (reverse proxy + static frontend).
# Lokasi di server: /etc/apache2/sites-available/ermapp.conf
# Aktifkan dengan: a2ensite ermapp && a2enmod proxy proxy_http rewrite ssl && systemctl reload apache2
#
# PENTING — AllowEncodedSlashes NoDecode + nocanon pada ProxyPass /api:
# Banyak route backend memakai no_rawat sebagai path parameter (mis. "2026/07/10/000093"),
# yang di-encode browser jadi "%2F". Secara default Apache menolak request dengan %2F di URL
# SEBELUM masuk ke mod_proxy dan langsung balas 404 miliknya sendiri (bukan 404 JSON dari Go
# backend). AllowEncodedSlashes NoDecode + nocanon membuat %2F diteruskan apa adanya ke backend.
# Tanpa ini, semua endpoint wildcard *no_rawat (soap-history, riwayat-pk, riwayat-pa, dll) 404.
<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/erm/frontend/dist

    AllowEncodedSlashes NoDecode

    <Directory /var/www/erm/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8080/api nocanon
    ProxyPassReverse /api http://127.0.0.1:8080/api

    ProxyPass /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd
    ProxyPassReverse /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd

    ProxyPass /radiologi http://127.0.0.1:8080/radiologi
    ProxyPassReverse /radiologi http://127.0.0.1:8080/radiologi

    ProxyPass /berkasrawat http://127.0.0.1:8080/berkasrawat
    ProxyPassReverse /berkasrawat http://127.0.0.1:8080/berkasrawat

    ProxyPass /labpa http://127.0.0.1:8080/labpa
    ProxyPassReverse /labpa http://127.0.0.1:8080/labpa

    ProxyPass /images http://127.0.0.1:8080/images
    ProxyPassReverse /images http://127.0.0.1:8080/images

    ProxyPass /uploads http://127.0.0.1:8080/uploads
    ProxyPassReverse /uploads http://127.0.0.1:8080/uploads

    ErrorLog ${APACHE_LOG_DIR}/ermapp_error.log
    CustomLog ${APACHE_LOG_DIR}/ermapp_access.log combined
</VirtualHost>

# Vhost HTTPS internal — port 80 di atas TIDAK bisa dipakai fitur
# kamera/GPS (mis. Absen di PresensiMobile.tsx): browser cuma mengizinkan
# getUserMedia() di "secure context" (HTTPS, atau localhost), dan alamat
# IP/hostname polos lewat HTTP TIDAK dianggap secure context.
#
# ServerName-nya SENGAJA disamakan dgn hostname eksternal
# (presensi.rsislamibnusinasigli.com, lihat deploy/ermapp-external.conf +
# deploy/cloudflared/) supaya staf bisa pakai SATU domain yang sama dari
# dalam maupun luar RS — dibedakan lewat DNS split-horizon: DNS lokal RS
# (mis. static DNS di Mikrotik) diarahkan ke IP internal server ini
# (192.168.1.220), sementara DNS publik (Cloudflare) tetap ke tunnel utk
# akses dari luar. Sertifikatnya juga sertifikat ASLI (Let's Encrypt,
# lewat DNS-01 challenge Cloudflare — bukan self-signed) khusus supaya
# valid dipakai dgn hostname ini tanpa peringatan browser, baik dari
# dalam RS (vhost ini) maupun dari luar (tunnel, TLS-nya di-terminate di
# edge Cloudflare pakai cert Cloudflare sendiri, bukan yang ini).
#
# DocumentRoot KHUSUS dist-presensi (bundle mobile-only PresensiMobile.tsx,
# lihat frontend/vite.presensi.config.ts / npm run build:presensi) — domain
# ini SEKARANG khusus presensi, BUKAN seluruh aplikasi lagi. Alasan: bundle
# app penuh (dist, ~943KB gzip) gagal/lama dimuat di HP dgn sinyal lemah,
# nampilin layar putih sebelum sempat login. dist-presensi jauh lebih kecil
# (~92KB gzip) krn cuma bawa Login/Register + PresensiMobile, tanpa modul
# desktop (Casemix/Radiologi/dst) atau library berat (pdf-lib/qrcode/dst).
# Vhost *:80 di atas (akses LAN desktop, ServerName _default_) TETAP
# DocumentRoot dist (app penuh) — TIDAK berubah.
<VirtualHost *:443>
    ServerName presensi.rsislamibnusinasigli.com
    DocumentRoot /var/www/erm/frontend/dist-presensi

    AllowEncodedSlashes NoDecode

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/presensi.rsislamibnusinasigli.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/presensi.rsislamibnusinasigli.com/privkey.pem

    <Directory /var/www/erm/frontend/dist-presensi>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8080/api nocanon
    ProxyPassReverse /api http://127.0.0.1:8080/api

    ProxyPass /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd
    ProxyPassReverse /asuhan-medis-igd http://127.0.0.1:8080/asuhan-medis-igd

    ProxyPass /radiologi http://127.0.0.1:8080/radiologi
    ProxyPassReverse /radiologi http://127.0.0.1:8080/radiologi

    ProxyPass /berkasrawat http://127.0.0.1:8080/berkasrawat
    ProxyPassReverse /berkasrawat http://127.0.0.1:8080/berkasrawat

    ProxyPass /labpa http://127.0.0.1:8080/labpa
    ProxyPassReverse /labpa http://127.0.0.1:8080/labpa

    ProxyPass /images http://127.0.0.1:8080/images
    ProxyPassReverse /images http://127.0.0.1:8080/images

    ProxyPass /uploads http://127.0.0.1:8080/uploads
    ProxyPassReverse /uploads http://127.0.0.1:8080/uploads

    ErrorLog ${APACHE_LOG_DIR}/ermapp_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ermapp_ssl_access.log combined
</VirtualHost>
