<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>ERM-Ibnusina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- "Add to Home Screen" iOS — ikon & mode standalone (tanpa chrome
         Safari) begitu dibuka dari ikon di layar utama, mirip pengalaman
         app native walau sebenarnya cuma bookmark web biasa. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent = status bar iOS jadi transparan, nunjukin
         warna latar konten di baliknya (bukan putih polos) — dipasangkan
         dgn padding env(safe-area-inset-top) di PresensiMobile.tsx supaya
         konten tidak ketiban ikon jam/baterai. Footer/bottom nav SENGAJA
         tidak ikut baca env(safe-area-inset-bottom) (lihat komentar di
         PresensiMobile.tsx) — supaya cuma header yang "fullscreen",
         footer tetap ukuran kompak seperti sebelumnya. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ERM Presensi" />

    <!-- Web app manifest — dukungan serupa di Android Chrome ("Tambahkan ke
         layar utama" / prompt install PWA). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
